[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cybedtools"
version = "0.0.1.dev0"
description = "Python interface to the cybedtools cross-framework cybersecurity workforce and learning frameworks graph. Foundation release: data loading and reference tables; query helpers are not yet implemented."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ryan Straight", email = "ryanstraight@arizona.edu" }]
keywords = ["cybersecurity", "workforce", "frameworks", "rdf", "sparql"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "rdflib>=7.0",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
oxigraph = ["pyoxigraph>=0.4"]
dev = ["pytest>=8", "build>=1.2"]

[project.urls]
Homepage = "https://ryanstraight.github.io/cybedtools/"
Repository = "https://github.com/ryanstraight/cybedtools"
Issues = "https://github.com/ryanstraight/cybedtools/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cybedtools"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "tools", "README.md", "LICENSE", "pyproject.toml"]
