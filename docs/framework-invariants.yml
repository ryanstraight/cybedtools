# Framework Invariants
#
# Declared expected entity counts per framework. Actual extraction must
# fall within the tolerance band. Bands are deliberately tight. If an
# extraction falls outside, the source has likely been revised and human
# review updates these numbers with audit trail.
#
# Rule: every entry here is justified in a comment citing the source.
# No unjustified tolerances.

frameworks:

  nice:
    version: "v2.2.0 (NIST SP 800-181 Rev 1 components)"
    version_date: "2026-04-28"
    structural_type: "role-first"
    jurisdiction: "US"
    sector: "civilian"
    specificity: "cybersecurity-specific"
    expected:
      # Measured 2026-08-21 from the NIST CPRT v2.2.0 export:
      # 42 work_role + 2,211 unique TKS (962 task + 693 knowledge + 556
      # skill) + 5 category + 11 competency_area + 5,410 role-TKS
      # associations. The "2,211" figure tracks unique statements, not
      # the 5,410 per-role rows. Skills = 556 includes S0768, which the
      # JSON/CSV distribution carries with zero role memberships but the
      # companion XLSX omits (NIST-internal contradiction); retained per
      # the orphan-retention policy.
      work_roles: [42, 42]
      tasks: [960, 964]
      knowledge: [691, 695]
      skills: [554, 558]
      unique_tks: [2209, 2213]
      role_tks_associations: [5408, 5412]
      categories: [5, 5]
      competency_areas: [11, 11]
    notes: |
      v2.2.0 CPRT export used (replaced the v2.0.0-era data in place,
      2026-08; superseded raw data archived at data/raw/nice/v2.0.0/).
      v2.2.0 added one work role (OG-WRL-017 Cybersecurity Supply Chain
      Risk Management),
      competency-area K/S membership relationships, and Federal-use OPM
      codes; it removed T1648 and K0908. The Investigation (IN) category
      description is patched at ingest via data/raw/nice/errata.csv (the
      published v2.2.0 text is an upstream regression). Earlier docs
      referenced "52 work roles, 2,280 statements" (NICE v1) and 41
      roles / 2,111 TKS (v2.0.0).

  sfia:
    version: "SFIA 9"
    version_date: "2024-10"
    structural_type: "skill-first"
    jurisdiction: "global"
    sector: "general-IT"
    specificity: "general-IT"
    source_extract: "jankudev/sfia-tools v0.0.1 (2025-02-05)"
    # SFIA's terms cover the concept, content and structure of SFIA, so there is
    # no structure-versus-text carve-out: nothing SFIA beyond aggregate counts
    # is published.
    public_redistribution: local_only
    expected:
      # jankudev extract as of 2025-02-05 yielded these counts.
      skills: [145, 149]
      skill_levels: [670, 675]
      skills_profiles: [44, 46]
      levels: [7, 7]  # SFIA defines exactly 7 responsibility levels
    notes: "SFIA 9 defines ~150 skills at seven responsibility levels."

  dcwf:
    version: "DCWF v5.1"
    version_date: "2025-07-25"
    structural_type: "role-first"
    jurisdiction: "US"
    sector: "defense"
    specificity: "cybersecurity-specific"
    # Work-role codes and task/KSA numbers come out of one numeric range, so a
    # role IRI and a statement IRI collide whenever the two ranges overlap: 33
    # of the 74 roles shared an IRI with a statement, and roles 801 and 632
    # were their own element. Unit IRIs therefore carry this discriminator and
    # the bare code is kept as schema:identifier. Statement IRIs are unchanged.
    unit_iri_prefix: "role-"
    expected:
      # DoD CIO v5.1 XLSX. Framework historically referenced as 71 roles;
      # v5.1 added data/AI roles bringing total to 74.
      work_roles: [73, 75]
      master_task_ksa: [2900, 3000]
    notes: "v5.1 added DA-series data/AI roles beyond the prior 71."

  csec2017:
    version: "CSEC2017 Curricular Guidelines v1.0"
    version_date: "2017-12-31"
    structural_type: "curriculum-guidelines"
    jurisdiction: "global"  # joint ACM/IEEE/AIS/IFIP
    sector: "higher-education"
    specificity: "cybersecurity-specific"
    framework_type: "pedagogical"
    # All rights reserved, with permission only for development of educational
    # materials and programs: names, counts and alignment scores are published,
    # statement text is not.
    public_redistribution: structure_only
    expected:
      knowledge_areas: [8, 8]
      essentials_total: [35, 42]
    notes: |
      Best-effort extraction from markitdown PDF output. 8 KAs + 38
      Essentials. Deeper KU/Topic/Learning-Outcome structure requires
      manual curation. License: ACM/IEEE/AIS/IFIP copyright with
      educational-development permission.

  digcomp:
    version: "DigComp 3.0"
    version_date: "2025-11-27"
    structural_type: "competence-framework"
    jurisdiction: "EU"
    sector: "citizen-education"
    specificity: "general-digital-competence"  # cybersec is the Safety area subset
    framework_type: "pedagogical"
    public_redistribution: full_with_attribution
    expected:
      # Exact: the official JSON-LD data supplement, hash-anchored in
      # data/raw/digcomp/v3.0/provenance.yml. Replaces DigComp 2.2 in place
      # (owner decision D1, 2026-08-21). Skeleton unchanged from 2.2: 5
      # areas, 21 competences, identical numbering and area membership.
      competence_areas:      [5, 5]
      competences:           [21, 21]
      descriptions_found:    [21, 21]  # official text, no extraction slip
      competence_statements: [362, 362]
      # 523 as published, 522 after applying errata E1 (duplicate
      # LO2.5.09 removed). See errata.csv.
      learning_outcomes:     [522, 522]
    notes: |
      Source of record is the official DigComp 3.0 data supplement
      (JSON-LD + XLSX, JRC144121), not a PDF scrape: every table is a
      verbatim @graph extraction, no hand-curation, no truncation.
      Replaces DigComp 2.2 (data/raw/digcomp/v2.2/ archived, not deleted).
      Of the 7 official errata, only E1 to E4 are applied: E1 is
      structural (delete + renumber) and E2 to E4 quote JRC's own
      replacement text verbatim. Errata E5 to E7 (LO4.3.22, LO5.2.12,
      LO5.4.13) are published as instructions without replacement text,
      so the staged wording is carried unchanged rather than composing
      new sentence text in JRC's name. The learning-outcome count (522)
      comes from E1 alone and is unaffected by E5 to E7 being unapplied.
      4 of 5 area names and 13 of 21 competence names were revised; the
      21 competence IRIs (digcomp:COMP-x.y) and 5 area IRIs (digcomp:AREA-*)
      survive unchanged. Competence Statements (362) and Learning Outcomes
      (523, 522 post-errata) are new structure with no 2.2 counterpart --
      2.2's ~250 "examples of knowledge, skills and attitudes" were never
      staged. Proficiency levels (8-level descriptors with 4-level and
      CEFR-style 6-level crosswalks) and a 126-term glossary are staged but
      not emitted into the graph. Cybersec relevance concentrates in Area 4,
      renamed "Safety, wellbeing and responsible use" (4.1-4.4).

  cyberorg-k12:
    version: "Cyber.org K-12 Cybersecurity Learning Standards v1.0"
    version_date: "2021-09-09"
    original_release: "2021-08-04"
    structural_type: "learning-standards"  # NOT a competency framework
    jurisdiction: "US"
    sector: "K-12 education"
    specificity: "cybersecurity-specific"
    framework_type: "pedagogical"
    # Non-commercial conditions also apply; see framework_licenses.
    public_redistribution: full_with_attribution
    # A grade-band x sub-concept cell is named after its axes, and so is the
    # standard inside it, so a cell holding exactly one standard had the same
    # IRI as that standard: 109 of the 116 cells, every one of them a
    # cybed:hasElement self-loop. Unit IRIs carry this discriminator and the
    # bare cell code is kept as schema:identifier. Standard IRIs are unchanged.
    unit_iri_prefix: "cell-"
    expected:
      # 4 grade bands (K-2, 3-5, 6-8, 9-12) x 29 sub-concepts, each cell
      # has 1-3 standards. Extraction yielded 123 standards on 2026-04-23.
      # Bounds allow modest flex in case cleanup-regex refinements shift
      # the boundary.
      grade_bands: [4, 4]
      themes: [3, 3]
      sub_concepts: [29, 29]
      standards_total: [118, 128]
    notes: |
      Cross-type framework: learning standards rather than competency
      framework, K-12 learner population rather than adult workforce.
      Useful for exercising the cybed: schema's portability beyond
      role-first competency frameworks.
      License: CC BY-NC 4.0. Commercial toolkit release cannot redistribute
      standard text.

  csta:
    version: "CSTA K-12 Computer Science Standards (Revised 2017)"
    version_date: "2017"
    structural_type: "learning-standards"
    jurisdiction: "US"
    sector: "K-12 education"
    specificity: "general-computing"  # cybersec coverage is a subset, not the whole
    framework_type: "pedagogical"
    # Non-commercial and share-alike conditions also apply; see framework_licenses.
    public_redistribution: full_with_attribution
    expected:
      # Measured 2026-04-23 from the CSTA Foundation XLSX:
      # 120 standards across 5 levels (1A, 1B, 2, 3A, 3B) and 5 concepts.
      standards_count: [118, 122]
      levels_count: [5, 5]
      clusters_count: [23, 27]
      concepts: [5, 5]
    notes: |
      Not cybersecurity-specific. Cybersec content lives in "Impacts of
      Computing" (22 standards) and "Networks & the Internet" (13 standards).
      Included for pedagogical breadth comparison against Cyber.org K-12.
      License: CC BY-NC-SA 4.0.

  csta-2026:
    version: "2026 CSTA PK-12 Computer Science Standards"
    version_date: "2026-07"
    structural_type: "learning-standards"
    jurisdiction: "US"
    sector: "K-12 education"
    specificity: "general-computing"  # cybersec coverage is a subset, not the whole
    framework_type: "pedagogical"
    # Non-commercial and share-alike conditions also apply; see framework_licenses.
    public_redistribution: full_with_attribution
    expected:
      # Exact bounds: the source is a fixed JSON capture of CSTA's Standards
      # Explorer whose 331 codes match the PDF one for one, and the ingest
      # stops unless its SHA256 matches provenance.yml. Any drift means a
      # different capture, which is a human-review event, not a tolerance to
      # absorb. Measured 2026-09-21 from csta-2026-standards-api.json.
      standards_count:          [331, 331]
      foundational_standards:   [196, 196]
      specialty_standards:      [135, 135]
      levels_count:             [10, 10]   # EK, E1-E5, MS, HS, S1, S2
      foundational_concepts:    [5, 5]
      specialty_areas:          [7, 7]     # six areas plus X+CS
      cybersecurity_standards:  [27, 27]   # CYB: 15 Specialty I + 12 Specialty II
      organizing_units:         [53, 53]   # observed pairs, never a crossing
      foundational_units:       [40, 40]   # 8 levels x 5 concepts
      specialty_units:          [13, 13]   # 6 areas x 2 tiers + X+CS at S1 only
      boundary_statements:      [660, 660] # paragraphs: 329 standards print 2, 2 print 1
      implementation_examples:  [652, 652]
      standards_with_examples:  [326, 326]  # unchanged: examples are attached from CSTA's example list, not parsed
      ai_standards:             [107, 107]
    notes: |
      A separate framework from csta-2017, not a revision of it. The two
      editions share no identifier scheme; CSTA's official crosswalk between
      them is many-to-many and is staged for concordance work, not ingested.
      Source of record is the JSON behind CSTA's interactive Standards
      Explorer, checked 1:1 against the 218-page PDF. Standards are
      cybed:RoleElement nodes keyed by CSTA's code verbatim. Organizing units
      are csta2026:StandardGroup: level x concept for the foundational tier,
      tier level x specialty area for the specialty tier. X+CS is published
      at Specialty I only, so it has one unit, not two. CSTA's prose names
      six specialty areas and introduces X+CS in addition; its identifier
      table and explorer treat X+CS as a seventh area code, which is how it is
      carried here.
      Implementation examples are web-display content that the print PDF
      does not carry. They are cybed:Example nodes reached by
      cybed:hasExample. Boundary statements are part of each standard and
      are carried as csta2026:boundaryStatement literals, not as Examples.
      Practices, dispositions, progressions and interdisciplinary connections
      are staged but not yet modelled.
      License: CC BY-NC-SA 4.0, read from the PDF's own licence page (p. iv).

  ecsf:
    version: "ECSF v1"
    version_date: "2022-09-19"
    revision_date: "2024-08-02"
    structural_type: "role-first"
    jurisdiction: "EU"
    sector: "civilian"
    specificity: "cybersecurity-specific"
    public_redistribution: full_with_attribution
    expected:
      # ENISA ECSF defines exactly 12 role profiles. Element counts vary
      # by profile. Totals measured empirically from ENISA JSON.
      role_profiles: [12, 12]
      profile_elements: [360, 390]
      ecf_cross_references: [50, 60]
    notes: "12 role profiles with embedded e-CF 4.0 cross-references."

  cyqual:
    version: "CyQUAL 1.2.0"
    version_date: "2026-09-16"
    structural_type: "role-first"
    jurisdiction: "CZ"
    sector: "civilian"
    specificity: "cybersecurity-specific"
    # Open data. Statement text may be published with attribution to CyQUAL
    # and Masaryk University.
    public_redistribution: full_with_attribution
    expected:
      # Exact bounds: the source is a versioned JSON open-data export whose
      # top-level array lengths the ingestion script already asserts against
      # the published 1.2.0 counts. Any drift means a different export, which
      # is a human-review event, not a tolerance to absorb.
      roles_count:                 [102, 102]
      elements_count:              [2488, 2488]  # 1,168 tasks + 1,320 requirements
      tasks:                       [1168, 1168]
      requirements:                [1320, 1320]
      competencies:                [59, 59]
      competency_groups:           [4, 4]
      specialization_areas:        [37, 37]
      categories:                  [7, 7]
      work_role_task_edges:        [1889, 1889]
      work_role_requirement_edges: [8838, 8838]
    notes: |
      Czech national cybersecurity qualifications framework, published by
      Masaryk University. Data version 1.2.0, retrieved 2026-09-16.
      Elements are shared across work roles (as NICE TKS statements are), so
      element nodes are built once per task/requirement and roles reference
      them by id; the 10,727 association edges are memberships, not distinct
      elements.
      Orphans: 107 tasks and 50 requirements are attached to no work role.
      They are part of the published framework and are emitted as element
      nodes, per the orphan-retention policy applied to NICE.
      WR091 carries zero tasks and WR092 carries zero requirements. Both are
      published work roles imported from ECSF with malformed associations
      upstream; both are retained as published.
      Sub-point parsing runs when the English export is the one staged, and is
      withheld when the Czech one is: the parser's introducer patterns are
      English-only. On the English 1.2.0 export it yields 852 cybed:Subpoint
      nodes over 245 of the 2,488 parents. Elements are shared, so subpoints
      attach to the shared parent once and every role and competency that
      references that parent extends its own element-id list from the same
      index, as NICE does.
      Language follows whichever export is staged (English preferred, Czech
      fallback) and is recorded in data/raw/cyqual/provenance.yml, which also
      lists the other staged edition with its hash. Both editions carry the
      same nine arrays and the same codes; only the text differs, and
      schema:inLanguage is asserted only when the staged text is not English.
      WR092's English title is "Chief Information Security Officer (ECSF)";
      the Czech export carried a placeholder in its place. WR091 and WR092
      both still carry an unparsed multi-section ECSF description blob, in
      both languages.
      Licensing: open data, derived RDF/JSON-LD permitted by written
      confirmation from the CyQUAL team, 2026-09-16; attribution to CyQUAL
      and Masaryk University required.

  ccssf:
    version: "CCSSF 2022 (ITSM.00.039, Revision 1)"
    version_date: "2023-04-19"
    structural_type: "role-first"
    jurisdiction: "CA"
    sector: "civilian"
    specificity: "cybersecurity-specific"
    # Consent is implied, not affirmative, so statement text is withheld from
    # publication: pending written confirmation from the Canadian Centre for
    # Cyber Security; revisit when received. Structure (role titles,
    # activity areas, competency titles, mappings) may be published.
    public_redistribution: structure_only
    expected:
      # Exact bounds: the source is a fixed PDF edition whose annex structure
      # the ingester asserts against the document's own declared counts. Any
      # drift means a different edition, which is a human-review event, not a
      # tolerance to absorb. Measured 2026-09-16 from ITSM.00.039 Revision 1.
      activity_areas:             [4, 4]      # Annexes A-D
      core_roles:                 [22, 22]    # A.1 through D.7
      adjacent_roles:             [37, 37]    # Annex E
      roles_count:                [59, 59]    # 22 core + 37 adjacent, both Roles
      core_role_elements:         [1368, 1368]
      adjacent_role_competencies: [265, 265]
      element_node_rows:          [1222, 1222]  # 293 tasks + 510 competencies + 154 tools + 265 adjacent competencies
      # Source-printed sub-bullets, nested under 8 colon-terminated parent
      # bullets in the Competencies field of roles A.2, A.3, B.2, D.1 and D.7.
      # They become cybed:Subpoint of their parent, so they leave the parent
      # population rather than adding to it.
      source_printed_subpoints:   [30, 30]
      nice_crosswalk_rows:        [59, 59]
      nice_crosswalk_ids:         [39, 39]
      nice_crosswalk_malformed_ids: [2, 2]
    notes: |
      Canadian national cyber security skills framework, published by the
      Canadian Centre for Cyber Security as ITSM.00.039. An explicit
      adaptation of the U.S. NICE Workforce Framework for the Canadian
      labour market. Supplied as an official PDF by the publisher's Cyber
      Skills Development Team, 2026-09-16.
      Two role populations, both emitted as cybed:Role: the 22 core work
      roles detailed in Annexes A through D (identified by the document's own
      section numbers, A.1 through D.7) and the 37 cyber adjacent roles
      tabulated in Annex E (no source identifier; stable slugs generated from
      the printed titles).
      Elements are per-role, not shared: only tasks, competencies, and tools
      and technology become element nodes. The other ten staged element types
      (consequence of error, development pathway, other titles, related NOCs,
      required qualifications/training/experience, future trends, functional
      description, NICE framework reference) are role-level attributes and
      stay in the staged tables.
      The source prints basic/intermediate/advanced lead-in lines inside the
      Competencies field; the ingester kept them as their own rows. The
      assembler treats the 44 matching a fixed lead-in set as headings rather
      than elements and carries their text as cybed:sourceSection on the rows
      they govern, restoring the nesting the source printed.
      A second kind of source-printed nesting: 30 Competencies rows sit under
      8 colon-terminated parent bullets, recorded at ingest as parent_index.
      They become cybed:Subpoint of that parent, typed and linked exactly as
      parser-made sub-points, and the role reaches them the same way. The
      sub-point parser is withheld from those 8 parents so it cannot split the
      same stem a second time into fragments that duplicate what the source
      already enumerates.
      NICE cross-references are cited at work-role granularity only, in the
      framework's own old-style NICE ids (OV-EXL-001), which do not match the
      NICE v2.2.0 ids in this graph. They are attached as
      cybed:niceCrossReference literals, never as links. 39 of the 59 roles
      cite an id; the rest print "None". The literal carries the normalized
      id. Two roles (B.1 "SP-ARC 002", B.3 "SP Dev-001") print a malformed id;
      for those the literal appends " [printed as: <as printed>]" so the
      source's typo stays visible rather than being corrected away silently.
      Text-length soft flags are expected on element-text and adjacent-comp:
      the source genuinely prints short runs ("None.", "VA tools",
      "BCP/DRP").
      Licensing: Copyright Government of Canada. Referenced as the Canadian
      Centre for Cyber Security asked. Not granted permission; supplied
      directly by the Cyber Skills Development Team, 2026-09-16, on
      condition that ITSM.00.039 is referenced wherever the material is
      used.

  otccf:
    version: "OTCCF version 1.1"
    version_date: "2021-10-08"
    structural_type: "role-first"
    jurisdiction: "SG"
    sector: "civilian"
    specificity: "cybersecurity-specific"
    # Statement text (key tasks, level statements, role and TSC descriptions)
    # may be analysed locally but must not be published on the Concordance
    # site or in any data deposit without further permission from CSA; titles,
    # categories, levels, and mappings may.
    public_redistribution: structure_only
    expected:
      # Exact bounds: the source is a fixed versioned PDF parsed
      # deterministically from word coordinates. Any drift means a different
      # edition or a parser change, which is a human-review event, not a
      # tolerance to absorb. Measured 2026-09-19 from
      # OT-Cybersecurity-Competency-Framework_V5.pdf.
      tracks:                   [5, 5]
      job_roles:                [15, 15]
      role_tracks:              [20, 20]     # many-to-many; two roles sit on two tracks
      critical_work_functions:  [62, 62]
      key_tasks:                [270, 270]
      tscs:                     [30, 30]
      skillsfuture_derived_tscs: [8, 8]
      tsc_level_statements:     [1319, 1319]
      range_of_application:     [23, 23]
      element_node_rows:        [1612, 1612]  # 270 key tasks + 1,319 level statements + 23 range of application
      role_tsc_map_rows:        [190, 190]
      role_tsc_map_unresolved:  [0, 0]
      role_tsc_map_variant_titles: [29, 29]   # 5 TSC titles, 29 map rows
      role_tsc_related_pairs:   [175, 175]    # 15 pairs carry two levels
      role_critical_core_skills_rows: [139, 139]
      role_critical_core_skills_unresolved: [0, 0]
      critical_core_skills:     [16, 16]      # distinct titles -> 16 units
      role_critical_core_skill_pairs: [100, 100]
      role_critical_core_skills_duplicate_rows: [19, 19]  # statements the source prints twice
      # Distinct published statements, one cybed:UnitRelation node each. The
      # staged row counts above (190, 139) are checked separately.
      unit_relations:           [310, 310]    # 190 TSC + 120 core (139 rows less 19 repeats)
    notes: |
      Singapore's Operational Technology Cybersecurity Competency Framework,
      published by the Cyber Security Agency of Singapore. The document
      describes itself as version 1.1, effective 8 October 2021, on every page
      footer, while the published filename carries the label V5; V5 is treated
      as a publisher-side file revision label, not the framework version. CSA
      has stated the OTCCF is currently being updated, so these tables should
      be re-cut when a successor is published.
      Two roots. The 15 job roles are cybed:Role (otccf:JobRole) and own the
      270 key tasks. The 30 Technical Skills and Competencies are a second
      organizing axis, not roles, and own the 1,319 level statements plus the
      23 Range of Application statements.
      The career map on page 4 draws 16 boxes; CISO appears in the map with no
      skills map, so 15 of the 16 carry content.
      Key-task-to-Critical-Work-Function nesting is derived from the
      document's layout rather than from published identifiers: CSA prints the
      CWF as a merged cell vertically centred over its block of tasks, and the
      per-role centring residual is recorded in job-roles.csv as
      max_centring_residual_pt. The CWF title is carried on each task as
      cybed:sourceSection; no node type is invented for it.
      8 of the 30 TSCs are marked "#Extracted from SkillsFuture ICT
      Framework", covering 365 of the 1,319 level statements and 48 of the 190
      role-to-TSC map edges. Those elements and unit nodes carry
      cybed:sourceCategory = "SkillsFuture ICT Framework".
      TSC categories are carried verbatim, including the two variant labels
      "Analyse and Detect" and "Organisational Management"; merging them would
      alter the published categorisation.
      Sub-point parsing is disabled. CSA's permission is conditional on not
      altering the intent of the published job roles, skills, and competency
      mappings, and parser-split fragments of CSA's statements would be units
      the package invented rather than units CSA published.
      A text-length soft flag is expected on range-of-application: the page-57
      cell prints three sub-lists side by side, and flattening it yields two
      genuinely short rows.
      Both skills maps are in the graph as of v0.3.0. The 190-row role-to-TSC
      map and the 139 role-to-Critical-Core-Skills rows emit one
      cybed:UnitRelation node per distinct statement, carrying the level as
      printed, and each role carries one cybed:relatedUnit vector over both
      maps' targets: 275 distinct role-to-target pairs. The 16 distinct Critical Core Skill
      titles become non-role organizing units (otccf:CriticalCoreSkill) with
      no elements. The skills themselves are SkillsFuture's, not CSA's; the
      OTCCF prints the titles and points to SkillsFuture for the definitions,
      so the units carry cybed:sourceCategory = "SkillsFuture Critical Core
      Skills" and nothing more.
      19 of the 139 Critical Core Skills rows repeat a (role, skill, level)
      statement the source prints twice. Relation rows are deduplicated on
      (role, target, level, label) before nodes are built, so the graph carries
      310 relation nodes with 310 distinct IRIs: 190 from the role-to-TSC map,
      120 from the Critical Core Skills map.
      Five TSC titles are spelled differently in the skills maps than in the
      TSC catalogue, across 29 of the 190 map rows. The variant spelling stays
      in role-tsc-map.csv$tsc_title_as_listed; the relation resolves on the
      slug, so no variant is lost and none reaches the graph as a second
      title.
      Licensing: Copyright Cyber Security Agency of Singapore. CSA granted
      written permission 2026-09-15 to reference and integrate the OTCCF's
      structure for non-commercial academic and research use, on condition of
      a verbatim attribution string and that ingestion scripts and structural
      mappings do not misrepresent or alter the intent of the framework as
      published.

  scywf:
    version: "SCyWF - 1.5 : 2026"
    version_date: "2026"
    structural_type: "role-first"
    jurisdiction: "SA"
    sector: "civilian"
    specificity: "cybersecurity-specific"
    # Written permission from the National Cybersecurity Authority (NCA),
    # 2026-09-20: full content with attribution, carried verbatim. See
    # framework_licenses.
    public_redistribution: full_with_attribution
    expected:
      # Exact bounds: the source is a fixed PDF (SHA256 in provenance.yml),
      # parsed deterministically from word coordinates and checked string by
      # string against an independent extraction. Any drift means a different
      # edition or a parser change, which is a human-review event, not a
      # tolerance to absorb. Measured 2026-09-21 from scywf_en.pdf.
      categories:               [5, 5]      # stated by the document, p. 9
      specialty_areas:          [12, 12]    # stated by the document, p. 9
      job_roles:                [40, 40]    # stated by the document, p. 9
      tasks:                    [646, 646]  # Table 9
      knowledge:                [430, 430]  # Table 10
      skills:                   [343, 343]  # Table 11
      statements:               [1419, 1419]
      role_statement_links:     [4794, 4794] # every code printed on a role card
      unresolved_card_codes:    [0, 0]      # card codes with no Appendix B statement
      orphan_statements:        [1, 1]      # S1505 is on no role card
      competency_areas:         [24, 24]    # Table 12
      role_competency_area_links: [84, 84]
      verbatim_failures:        [0, 0]      # carried strings missing from the check text
    notes: |
      The Saudi Cybersecurity Workforce Framework, issued by the National
      Cybersecurity Authority of the Kingdom of Saudi Arabia. The ingested
      edition is SCyWF - 1.5 : 2026, by owner decision: NCA's grant named
      an earlier edition (SCyWF - 1 : 2020) that is no longer published.
      NICE-style: 40 job roles (scywf:JobRole, cybed:Role) keyed by NCA's
      printed Job Role ID, and Task, Knowledge and Skill statements keyed by
      NCA's printed codes. Role cards print codes only, so role-to-statement
      links come from the cards and statement text from Appendix B.
      SCyWF reuses NICE-shaped codes (T0036, K0001, S0001). A shared code
      does not mean a shared statement: the text under a code shared with
      NICE v2.2.0 differs every time. The two frameworks are never joined on
      a bare code.
      Categories and specialty areas are organizing units. Category ICSOT and
      specialty area ICSOT share one ID, so both kinds carry an IRI
      discriminator (category-, specialty-). Job role IDs, CA codes and
      statement codes cannot collide, so no framework-wide unit_iri_prefix
      is declared. The hierarchy edges (scywf:inSpecialtyArea,
      scywf:inCategory) are cybedtools-derived, not NCA content.
      The 24 competency areas of Appendix C are non-role organizing units
      with no statement membership, which NCA does not publish. Roles reach
      them through cybed:relatedUnit from the CA codes on their cards.
      Sub-point parsing is disabled: NCA's permission requires verbatim
      carriage, and a parser-split fragment would be text NCA did not print.
      The Career Progression companion (SCyWF-CP 1:2026) is staged, not
      ingested. The category and specialty area descriptions of Tables 1
      and 2 are not carried yet.

# Graph invariants describe the post-expansion counts after the v0.1.1
# sub-point parser runs over each framework's elementText literals. These
# differ from the per-framework source-data invariants above, which
# describe inputs to the assembly pipeline. The numbers here describe
# outputs under the v0.2.0 vocabulary.
#
# Three counts per framework:
#   parent_elements        Atomic parent elements (before parser expansion).
#   subpoint_elements      cybed:Subpoint instances (framework-as-specified
#                          enumerations: "such as", "including", semicolon
#                          lists). Carry parent's framework subtype.
#   example_elements       cybed:Example instances (pedagogical scaffolding
#                          from "Clarification statement:" sources). Carry
#                          no framework-native subtype. Reachable only via
#                          the parent element's cybed:hasExample.
#   total_elements_with_subpoints
#                          parent_elements + subpoint_elements
#                          (framework-as-specified content; the headline
#                          density-comparison count).
#   total_elements_full    parent_elements + subpoint_elements + example_elements
#                          (inclusive count for granular search-index work).
#
# Strict-inflation factor is total_elements_with_subpoints / parent_elements and
# captures how much each framework's framework-as-specified prose
# surfaces when run through parse_subpoints(). Frameworks near 1.00x have
# no meaningful enumerations to lift. SFIA is the only framework with
# meaningful Subpoint inflation; Cyber.org K-12 and CSTA route their
# parsed content to Examples (not counted in total_elements_with_subpoints).

# Re-measured 2026-08-21 from the rebuilt combined graph. Two changes since
# the previous measurement: (1) the 2026-08-14 DCWF fixes (parseable
# statement text + the "(e.g., ...)" introducer fix) lifted DCWF's Subpoint
# count from 0 to ~1,100, which the previous combined totals predated; and
# (2) NICE v2.2.0 added one work role and 11 competency-area OrganizingUnits
# (role_count 127 -> 128, and +100 NICE parent elements).
# CyQUAL joined the pipeline 2026-09-18, adding 161 organizing units (102
# Role-typed work roles + 59 competencies), 102 roles, and 3,340 elements
# (2,488 parents + 852 Subpoints; the parser was enabled once the English
# export was staged).
# CCSSF joined 2026-09-18, adding 59 organizing units (all Role-typed: 22 core
# work roles + 37 Annex E adjacent roles) and 1,353 elements (1,178 parents +
# 175 Subpoints).
# CSTA PK-12 2026 joined 2026-09-21 as a twelfth framework, adding 53 non-role
# organizing units and 983 elements (331 standards + 652 implementation-
# example Examples). The sub-point parser is disabled for csta-2026 on
# fidelity grounds, the same treatment OTCCF gets.
# OTCCF joined 2026-09-19, adding 61 organizing units (15 Role-typed job roles +
# 30 non-role Technical Skills and Competencies + 16 non-role Critical Core
# Skills) and 1,612 elements, all parents: the sub-point parser is disabled for
# OTCCF on fidelity grounds. OTCCF also contributes the graph's first 310
# cybed:UnitRelation nodes.
# CCSSF's 30 source-printed sub-bullets moved from the parent population to
# cybed:Subpoint in the same pass, which is why its parent count drops by 30
# and its strict total by 8.
# SCyWF joined 2026-09-21 as a thirteenth framework, adding 81 organizing units
# (40 Role-typed job roles + 24 competency areas + 12 specialty areas + 5
# categories) and 1,419 elements, all parents: the sub-point parser is
# disabled for scywf, as for OTCCF, csta-2026 and digcomp.
# DigComp 3.0 joined 2026-09-21, replacing digcomp-2.2 in place, adding 26
# organizing units (5 areas + 21 competences) and 884 elements (362
# Competence Statement parents + 522 Learning Outcome Examples). Sub-point
# parser disabled for digcomp on fidelity grounds, the same treatment
# OTCCF and csta-2026 get.
graph_invariants:
  combined:
    organizing_unit_count: [874, 878]   # all 13 frameworks' parents (+53 from CSTA 2026, +21 from DigComp 3.0's new Competence tier, +81 from SCyWF)
    role_count:            [344, 344]   # NICE 42 + DCWF 74 + ECSF 12 + CyQUAL 102 + CCSSF 59 + OTCCF 15 + SCyWF 40
    total_elements_with_subpoints: [16108, 16316] # parents + Subpoints across all 13 (+331 from CSTA 2026, +362 from DigComp 3.0 and +1,419 from SCyWF, all parser-disabled)
    total_elements_full:   [17782, 17990] # adds Examples (Cyber.org K-12 ~369 + CSTA 2017 ~114 + CSTA 2026 652 + DigComp 3.0 522)
    example_count:         [1649, 1672] # ~369 Cyber.org K-12 + ~114 CSTA 2017 + 652 CSTA 2026 + 522 DigComp 3.0
    # cybed:UnitRelation nodes. OTCCF is the only framework publishing
    # qualified unit-to-unit statements so far.
    unit_relation_count:   [310, 310]   # OTCCF 190 TSC + 120 distinct core-skill statements
    framework_count:       [13, 13]
  per_framework:
    # Nine of the thirteen frameworks run with the parser enabled. OTCCF,
    # csta-2026, digcomp-3.0 and scywf-1.5 run with it off (see their
    # parser_enabled: false below). The 2026-05-08
    # parser refinement (sentence-boundary stop + connective filter)
    # brought SFIA and CSEC2017 from initial 30%+ false-positive rates to
    # 0%. The v0.2.0 vocabulary additionally splits parsed content into
    # cybed:Subpoint (framework-as-specified) and cybed:Example
    # (pedagogical scaffolding). Cyber.org K-12 and CSTA Clarification
    # statements route to Example; everywhere else routes to Subpoint.
    nice-v2:
