# Public data release manifest configuration.
#
# scripts/030-export-release.R reads this file to decide what ships. It is the
# allowlist, and it is deliberately separate from the redistribution policy in
# docs/framework-invariants.yml. The two gates are independent and a file is
# written only when both allow it:
#
#   1. Policy gate. public_redistribution in docs/framework-invariants.yml,
#      read through the same table concordance/_publication-guard.R uses. An
#      unrecognised or unmapped value stops the export. local_only is never
#      written in any form.
#   2. Release gate. The `shipped` list below. A framework whose policy would
#      permit a file still does not get one until its slug appears here.
#
# Every framework declared in docs/framework-invariants.yml must appear exactly
# once across `shipped`, `held` and `refused`. A framework that appears nowhere
# stops the export rather than being quietly omitted.
#
# The reasons under `held` and `refused` are published verbatim in the release
# manifest and in the release README, so they are written for a reader outside
# the project.

release_version: "2026.09.1"

# The release date is recorded here rather than stamped at build time. A
# generation timestamp inside the manifest would change the manifest's bytes on
# every run and destroy the reproducibility the hashes exist to demonstrate.
release_date: "2026-09-19"

graph_schema_version: "0.3.0"
vocabulary_iri: "https://w3id.org/cybed/ontology#"

# Concept DOI of the software record. The data deposit carries its own DOI.
concept_doi: "10.5281/zenodo.20076116"

# Predicates whose objects carry framework statement text. A structure_only
# file drops every triple on these predicates. Derived from a predicate census
# of all eleven per-framework N-Triples files: these two are the only
# predicates in the graph whose literals are the frameworks' own statements and
# descriptions. Titles, categories, levels, sections and mappings sit on other
# predicates and stay.
structure_only_omit_predicates:
  - "https://w3id.org/cybed/ontology#elementText"
  - "http://schema.org/description"

# Backstop check on a structure_only file: after the omit list is applied, no
# surviving literal may exceed this many characters except under an allow-listed
# predicate. This is a tripwire against a bulk leak, not a text classifier: it
# catches a whole predicate escaping the filter, and it cannot catch one short
# statement. The bound is set from measurement. The longest non-allow-listed
# literal surviving in a structure_only file is a 134-character OT Cybersecurity
# Competency Framework Critical Work Function heading on
# cybed:sourceSection, so 200 clears every observed structural literal with
# headroom while sitting well below the bulk of statement text.
long_literal_threshold: 200

# Predicates exempt from the backstop. Both carry the licensor's own terms and
# credit wording, both are required in the file, and both are a single triple
# per framework.
long_literal_allow_predicates:
  - "http://schema.org/license"
  - "http://schema.org/creditText"

# Release 1. One gzip-compressed N-Triples file per slug, named by slug.
shipped:
  - nice
  - dcwf
  - ecsf
  - digcomp
  - cyqual
  - cyberorg-k12
  - csta
  - otccf

# Cleared by policy for a structure-only file, withheld from this release
# anyway. A deposit cannot be withdrawn, so a framework ships only once its
# steward has confirmed in writing.
held:
  ccssf: "Steward confirmation pending."
  csec2017: "Steward confirmation pending."

# Refused by policy, in every release. The export stops if a slug listed here
# has any policy other than local_only, and stops if a local_only slug appears
# under shipped.
refused:
  sfia: "The publisher's terms cover the framework's structure as well as its text. A licence is available from the publisher."

# Exclusions are a third gate, and unlike the first two they act inside a file
# rather than on the file as a whole. A framework still ships; a named part of
# it does not.
#
# An exclusion of kind `unit_element_links` removes the mappings from the named
# organizing units to the framework's statements. It is the narrowest cut the
# graph allows, and it is deliberately narrow:
#
#   What it removes. Every triple on a unit-to-element link predicate whose
#   unit side is one of the named units. Then, as a consequence, every element
#   that is left attached to no unit at all in that file, together with that
#   element's own triples and the sub-points and examples that elaborate it. An
#   element reachable only from an excluded unit would otherwise ship as a
#   free-floating statement whose only provenance was an excluded unit, which
#   is the opposite of what an exclusion is for.
#
#   What it does NOT remove. The unit nodes themselves. Their identifiers,
#   their types, their names and their membership in the framework all stay, so
#   a reader can see that the unit exists and that its mappings are absent
#   rather than being left to wonder whether the unit exists at all. It also
#   does not remove any element that any other unit in the same framework also
#   draws on. A shared statement belongs to the framework's own master list and
#   keeps every one of its other links.
#
# `units` are matched on the exact local part of the unit's IRI, the text after
# the last `#` or `/`. That local part is not always the framework's own
# printed code: a framework whose units and statements share one id space
# mints its unit IRIs with the `unit_iri_prefix` declared for it in
# docs/framework-invariants.yml, and the printed code is carried as a
# schema:identifier literal instead. DCWF's work role 121 is the unit
# `role-121`. The match is never on a name or a substring of one. A
# unit id that resolves to no unit in that framework's file stops the export,
# so a typo cannot quietly exclude nothing. A framework named here that is not
# on the `shipped` allowlist also stops the export.
#
# `reason` is published verbatim in the manifest and in the release README, so
# it is written for a reader outside the project. `since` records the release
# in which the exclusion first applied.
exclusions:
  - framework: dcwf
    kind: unit_element_links
    units: ["role-121", "role-122", "role-132", "role-133", "role-321", "role-322", "role-442", "role-443", "role-463"]
    reason: "The source workbook labels these nine work roles (CUI) in its index without any control marking or explanation. Their role-to-statement mappings are omitted pending clarification from the DoD CIO."
    since: "2026.09.1"
